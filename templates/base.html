<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Tat Stephen{% endblock %}</title>

  <!-- Tailwind (local) — must load BEFORE the config below -->
  <script src="{{ url_for('static', filename='js/tailwind.js') }}"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            body: ['DM Sans', 'sans-serif'],
          },
          fontWeight: {
            600: '600',
            700: '700',
            800: '800',
            900: '900',
          },
          colors: {
            accent: '#FFFEF2',
            'accent-light': '#FFFEF2',
          },
          animation: {
            'fade-up': 'fadeUp 0.6s ease forwards',
            'fade-in': 'fadeIn 0.5s ease forwards',
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(24px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- Fonts & icons (these still need internet) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

  {% block head %}{% endblock %}
</head>

<body class="min-h-screen">

  <!-- ─── NAVBAR ─────────────────────────────────────────────────────── -->
  <nav class="fixed top-0 left-0 right-0 z-50 py-3 dark:bg-[#0e0e0e]/80 bg-[#FFFEF2]/80 backdrop-blur">
    
    <div class="max-w-4xl mx-auto px-6 h-14 flex items-center justify-between">
    
      <div class="flex items-center gap-5">
      <!-- Desktop links -->
      <a href="{{ url_for('index') }}" class="text-muted">TAT</a>
      <a href="{{ url_for('works') }}" class="text-muted">Works</a>
      <a href="{{ url_for('contact') }}" class="text-muted">Contact</a>
    </div>

      <div class="flex items-center gap-4">
        <!-- Theme toggle -->
        <button id="theme-toggle" aria-label="Toggle theme" style="background:transparent; width:35px;position: relative;
      cursor: pointer;
      display: flex;
      align-items: center; height:35px">
          <span class="knob" style="position: absolute; top: 0px;
      display:flex;align-items: center;justify-content: center;
      width: 100%; height: 100%;
      border-radius: 50%; 
      background: transparent;
      border: solid 1px #eee;">a</span>
        </button>
        <!-- Mobile hamburger -->
        <button id="hamburger" class="hidden flex flex-col gap-1.5 p-1" aria-label="Menu">
          <span class="block w-5 h-px dark:bg-white bg-black transition-all"></span>
          <span class="block w-5 h-px dark:bg-white bg-black transition-all"></span>
          <span class="block w-3 h-px dark:bg-white bg-black transition-all self-end"></span>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="flex-col px-6 pb-4 gap-3 border-t border-subtle">
      <a href="{{ url_for('works') }}#work" class="nav-link py-2 block">Work</a>
      <a href="{{ url_for('contact') }}" class="nav-link py-2 block">Contact</a>
    </div>
  </nav>

  <!-- ─── PAGE CONTENT ───────────────────────────────────────────────── -->
  {% block content %}{% endblock %}

  <footer class="max-w-4xl mx-auto p-6 border-t dark:border-white/20 border-black/20 flex gap-3">
    <a href="https://github.com/tatstephenweb" class="text-muted">GitHub</a>
    <a href="mailto:tatstephenweb@gmail.com" class="text-muted">tatstephen15@gmail.com</a>
  </footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
